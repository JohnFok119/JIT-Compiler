name: pages

# Publishes the browser demo (make web -> web/site) to GitHub Pages on every
# push to main. The engine is built and smoke-tested first.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: emscripten/emsdk:3.1.74
    steps:
      - uses: actions/checkout@v4
      - name: Build the engine and the demo site
        run: make wasm && node web/test/smoke.mjs && make web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
